description = "Find real potential B2B clients by enumerating companies from public directories, scoring their fit, and exporting a reviewable lead list"
prompt = """
Read AGENTS.md first. This is a command-based workflow.

1. Check config/search.request.json.
2. If missing, copy config/search.request.example.json or run npm run setup.
3. Ask only for missing details:
   - service or product offered
   - target client type or industry
   - country (city is optional)
4. Update config/search.request.json.
5. Run npm run doctor to verify setup.
6. Run npm run scan — the scanner enumerates companies from public directories
   (Overpass API, Google Places, browser directories), scores them, and exports.
7. Run npm run leads.
8. Point the user to output/latest.html and the other files in output/.

Alternative flows:
- Enrich only: If you already have config/candidates.json, run npm run enrich.
- Score only: If you have a hand-written candidates.json, run npm run score.
  Never use npm run scan for hand-written files — it overwrites candidates.json.

Guardrails:
- Use only public business data. Never invent companies, contacts, or source
  links. Leave unknown fields null or empty.
- Do not bypass robots.txt, paywalls, logins, CAPTCHAs, or rate limits.
- Never send outreach automatically.
"""
